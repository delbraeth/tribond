<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>TRIBOND Practice</title>
  <style>
    :root {
      --bg:     #0b0b15;
      --panel:  #11111d;
      --card:   #181826;
      --border: #2c2c48;
      --accent: #ff3e6c;
      --gold:   #ffd740;
      --blue:   #40c4ff;
      --text:   #eceeff;
      --muted:  #7b7fa8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 32px 16px 60px; }
    .logo { font-size: 3.4rem; font-weight: 900; letter-spacing: 10px; background: linear-gradient(130deg, var(--accent) 0%, var(--gold) 55%, var(--blue) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 4px; }
    .tagline { color: var(--muted); font-size: .8rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 36px; }
    .counter { color: var(--muted); font-size: .82rem; margin-bottom: 20px; letter-spacing: 1px; }
    .card { width: 100%; max-width: 640px; background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 36px 28px 32px; box-shadow: 0 16px 60px rgba(0,0,0,.55); animation: rise .35s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; align-items: center; gap: 0; }
    @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    .tiles { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; width: 100%; margin-bottom: 32px; }
    .tile { background: var(--panel); border: 2px solid var(--border); border-radius: 14px; padding: 24px 8px; text-align: center; font-size: 1.1rem; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text); min-height: 80px; display: flex; align-items: center; justify-content: center; transition: border-color .4s, background .4s, color .4s; }
    .tile.lit { border-color: var(--gold); background: rgba(255,215,64,.08); color: var(--gold); animation: pop .45s ease; }
    @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.07); } 100% { transform: scale(1); } }
    .reveal-btn { width: 100%; padding: 18px; border-radius: 14px; border: 2px dashed var(--border); background: transparent; color: var(--muted); font-size: 1rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: border-color .2s, color .2s, background .2s; }
    .reveal-btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(255,215,64,.04); }
    .answer-block { display: none; width: 100%; text-align: center; animation: rise .3s ease; }
    .answer-block.show { display: block; }
    .answer-word { font-size: 3.2rem; font-weight: 900; letter-spacing: 6px; text-transform: uppercase; background: linear-gradient(130deg, var(--gold), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 20px; line-height: 1; }
    .bonds { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; width: 100%; margin-bottom: 28px; }
    .bond-chip { background: rgba(255,215,64,.06); border: 1px solid rgba(255,215,64,.22); border-radius: 10px; padding: 11px 8px; text-align: center; font-size: .82rem; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--gold); line-height: 1.4; }
    .next-btn { width: 100%; padding: 16px; border-radius: 14px; border: none; background: linear-gradient(90deg, var(--accent), #ff7a59); color: #fff; font-size: 1rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: opacity .2s, transform .15s; }
    .next-btn:hover { opacity: .88; transform: scale(1.01); }
    #done { display: none; text-align: center; max-width: 640px; width: 100%; animation: rise .4s ease; }
    #done.show { display: block; }
    #done h2 { font-size: 1.4rem; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; }
    #done p { font-size: 1.1rem; color: var(--text); margin-bottom: 32px; }
    .replay-btn { padding: 16px 52px; border-radius: 14px; border: none; background: linear-gradient(90deg, var(--accent), #ff7a59); color: #fff; font-size: 1rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: opacity .2s; }
    .replay-btn:hover { opacity: .88; }
  </style>
</head>
<body>

  </div>
  <button class="reveal-btn" id="reveal-btn" onclick="reveal()">Reveal Answer</button>
  <div class="answer-block" id="answer-block">
    <div class="answer-word" id="answer-word"></div>
    <div class="bonds" id="bonds"></div>
    <button class="next-btn" id="next-btn" onclick="next()">Next Puzzle &rarr;</button>
  </div>
</div>
<div id="done">
  <h2>All Done!</h2>
  <p>You've worked through all 150 TRIBONDs.</p>
  <button class="replay-btn" onclick="init()">&#128257; Play Again</button>

  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function render() {
  const d = DATA[current];
  document.getElementById('counter').textContent = 'Puzzle ' + (current + 1) + ' of ' + DATA.length;
  const pairs = d.items.map((item, i) => ({ item, bond: d.bonds[i] }));
  shuffle(pairs);
  ['t0','t1','t2'].forEach((id, i) => {
    const el = document.getElementById(id);
    el.textContent = pairs[i].item;
    el.classList.remove('lit');
  });
  DATA[current]._shuffledBonds = pairs.map(p => p.bond);
  document.getElementById('reveal-btn').style.display = '';
  document.getElementById('answer-block').classList.remove('show');
  document.getElementById('next-btn').textContent = current === DATA.length - 1 ? 'Finish' : 'Next Puzzle \u2192';
}

function reveal() {
  const d = DATA[current];
  ['t0','t1','t2'].forEach(id => document.getElementById(id).classList.add('lit'));
  document.getElementById('answer-word').textContent = d.answer;
  const bondsEl = document.getElementById('bonds');
  bondsEl.innerHTML = '';
  (d._shuffledBonds || d.bonds).forEach(b => {
    const chip = document.createElement('div');
    chip.className = 'bond-chip';
    chip.textContent = b;
    bondsEl.appendChild(chip);
  });
  document.getElementById('reveal-btn').style.display = 'none';
  document.getElementById('answer-block').classList.add('show');
}

function next() {
  current++;
  if (current >= DATA.length) {
    document.getElementById('card').style.display = 'none';
    document.getElementById('done').classList.add('show');
  } else {
    const card = document.getElementById('card');
    card.style.animation = 'none';
    card.offsetHeight;
    card.style.animation = '';
    render();
  }
}

init();
</script>
</body>
</html>
